<title>Check de Cijfers Restyle Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* ---------- page chrome (the wrapper around the mock frames) ---------- */
:root{
  --pg-bg:#f6f6f7; --pg-fg:#18181b; --pg-muted:#6b6b74; --pg-border:#dedee3; --pg-card:#ffffff; --pg-accent:#18181b; --pg-accent-fg:#fafafa;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --pg-bg:#111113; --pg-fg:#ededf0; --pg-muted:#9a9aa3; --pg-border:#2a2a2f; --pg-card:#18181b; --pg-accent:#fafafa; --pg-accent-fg:#18181b; }
}
:root[data-theme="dark"]{ --pg-bg:#111113; --pg-fg:#ededf0; --pg-muted:#9a9aa3; --pg-border:#2a2a2f; --pg-card:#18181b; --pg-accent:#fafafa; --pg-accent-fg:#18181b; }

*{box-sizing:border-box}
body{margin:0;background:var(--pg-bg);color:var(--pg-fg);font:14px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:5;background:var(--pg-bg);border-bottom:1px solid var(--pg-border);padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px}
.topbar h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.topbar h1 small{display:block;font-weight:400;color:var(--pg-muted);font-size:12px;margin-top:1px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--pg-muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--pg-border);border-radius:8px;padding:2px;background:var(--pg-card)}
.seg button{appearance:none;border:0;background:transparent;color:var(--pg-muted);font:inherit;font-size:13px;padding:5px 12px;border-radius:6px;cursor:pointer}
.seg button:hover{color:var(--pg-fg)}
.seg button[aria-pressed="true"]{background:var(--pg-accent);color:var(--pg-accent-fg);font-weight:500}
.seg button:focus-visible{outline:2px solid var(--pg-accent);outline-offset:1px}
.wrap{padding:24px;max-width:1500px;margin:0 auto}
.note{max-width:1500px;margin:0 auto 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 28px}
.note h2{font-size:13px;font-weight:600;margin:0 0 2px}
.note p{margin:0;color:var(--pg-muted);font-size:13px;line-height:1.45}
.note dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.note dt{color:var(--pg-muted)}
.note dd{margin:0}
.stage{display:grid;gap:18px}
.stage.both{grid-template-columns:1fr 1fr}
.stage.all{grid-template-columns:1fr}
.frame-wrap{position:relative;overflow:hidden;border-radius:10px;border:1px solid var(--pg-border);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.frame-cap{font-size:12px;color:var(--pg-muted);margin:0 0 6px;display:flex;justify-content:space-between}
.frame{width:1280px;height:800px;transform-origin:top left;position:absolute;top:0;left:0}
@media (max-width:900px){.stage.both{grid-template-columns:1fr}}

/* ---------- shadcn/ui zinc tokens, scoped to a mock frame ---------- */
.t-light{
  --bg:#ffffff; --fg:#09090b; --card:#ffffff; --muted:#f4f4f5; --muted-fg:#71717a; --border:#e4e4e7; --input:#e4e4e7;
  --primary:#18181b; --primary-fg:#fafafa; --secondary:#f4f4f5; --accent:#f4f4f5; --ring:#a1a1aa; --sidebar:#fafafa; --shadow:0 4px 12px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  color-scheme:light;
}
.t-dark{
  --bg:#09090b; --fg:#fafafa; --card:#09090b; --muted:#27272a; --muted-fg:#a1a1aa; --border:#27272a; --input:#27272a;
  --primary:#fafafa; --primary-fg:#18181b; --secondary:#27272a; --accent:#27272a; --ring:#d4d4d8; --sidebar:#18181b; --shadow:0 4px 16px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
.frame{background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5;display:flex;overflow:hidden;--r:8px}
.frame.f-a{font-family:"Geist","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--r:8px}
.frame.f-b{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--r:6px}
.frame.f-c{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--r:12px}
.frame svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.frame .sm svg.ic{width:14px;height:14px}

/* buttons, chips, tabs (shadcn look) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid transparent;font:inherit;font-size:14px;font-weight:500;color:var(--fg);background:transparent;cursor:default;white-space:nowrap}
.btn.outline{border-color:var(--input);background:var(--bg)}
.btn.primary{background:var(--primary);color:var(--primary-fg)}
.btn.ghost{color:var(--muted-fg)}
.btn.secondary{background:var(--secondary)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.xs{height:28px;padding:0 8px;font-size:12px}
.btn.icon{width:36px;padding:0}
.btn.icon.sm{width:32px}
.btn.icon.xs{width:28px}
.btn.round{border-radius:999px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--input);font-size:12.5px;font-weight:500;color:var(--fg);background:var(--bg)}
.chip.on{background:var(--secondary);border-color:transparent}
.chip.off{color:var(--muted-fg)}
.chip.dis{color:var(--muted-fg);opacity:.6;border-style:dashed}
.chip .badge{font-size:10px;text-transform:uppercase;letter-spacing:.05em;background:var(--muted);color:var(--muted-fg);border-radius:4px;padding:1px 5px;line-height:1.3}
.chip.sq{border-radius:var(--r)}
.chip.ghost{border-color:transparent;background:transparent;color:var(--muted-fg)}
.chip.ghost.on{color:var(--fg);background:var(--secondary)}
.tabs-pill{display:inline-flex;background:var(--muted);border-radius:var(--r);padding:3px;gap:2px}
.tabs-pill .tab{height:28px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border-radius:calc(var(--r) - 2px);font-size:13px;font-weight:500;color:var(--muted-fg)}
.tabs-pill .tab.active{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tabs-line{display:flex;gap:18px;border-bottom:1px solid var(--border);padding:0 16px}
.tabs-line .tab{padding:10px 0;font-size:13px;font-weight:500;color:var(--muted-fg);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.tabs-line .tab.active{color:var(--fg);border-bottom-color:var(--fg)}
.tabs-chip{display:flex;gap:6px;flex-wrap:wrap}
.tabs-chip .tab{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r);font-size:13px;font-weight:500;color:var(--muted-fg);border:1px solid transparent}
.tabs-chip .tab.active{background:var(--secondary);color:var(--fg)}
.kbd{font-size:11px;color:var(--muted-fg);border:1px solid var(--border);border-radius:4px;padding:0 5px;line-height:1.5}

/* sidebar */
.sb{display:flex;flex-direction:column;flex:none;overflow:hidden}
.sb .grp{font-size:11px;font-weight:500;color:var(--muted-fg);padding:14px 12px 4px;letter-spacing:.02em}
.sb .row{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;margin:0 6px;border-radius:calc(var(--r) - 2px);font-size:13.5px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .row span{overflow:hidden;text-overflow:ellipsis}
.sb .row.active{background:var(--accent)}
.sb .row.active.strong{background:var(--primary);color:var(--primary-fg)}
.sb .foot{margin-top:auto;border-top:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:10px}
.avatar{width:28px;height:28px;border-radius:999px;background:var(--muted);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.avatar.sq{border-radius:calc(var(--r) - 2px)}
.avatar.inv{background:var(--primary);color:var(--primary-fg)}

/* main chat column */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.msgs{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:22px;padding:28px 24px 8px}
.col{width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.u{align-self:flex-end;max-width:78%;padding:10px 16px;font-size:14.5px;line-height:1.5}
.u.bubble{background:var(--muted);border-radius:18px}
.u.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px}
.u.inv{background:var(--primary);color:var(--primary-fg);border-radius:20px}
.a{align-self:flex-start;max-width:100%;font-size:15px;line-height:1.6;display:flex;gap:12px}
.a p{margin:0}
.a .src{font-size:12.5px;color:var(--muted-fg);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.a .src b{font-weight:500;color:var(--fg)}
.a .src .dot{width:3px;height:3px;border-radius:99px;background:var(--muted-fg)}
.a .pin{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg);border:1px solid var(--border);border-radius:var(--r);padding:4px 8px;margin-top:10px;background:var(--bg)}
.a .pin svg.ic{width:14px;height:14px;color:var(--muted-fg)}

/* composer */
.composer{width:100%;max-width:720px;margin:0 auto}
.box{border:1px solid var(--input);border-radius:calc(var(--r) + 6px);background:var(--bg);padding:12px 12px 10px}
.box .ta{min-height:48px;font-size:15px;color:var(--muted-fg);padding:2px 4px}
.box .ta.filled{color:var(--fg)}
.box .bar{display:flex;align-items:center;gap:6px;margin-top:8px}
.box .bar .spacer{flex:1}
.fine{font-size:11.5px;color:var(--muted-fg);text-align:center;margin:8px 0 12px}

/* dock */
.dock{flex:none;display:flex;flex-direction:column;overflow:hidden}
.dock .body{flex:1;padding:18px 16px 8px;display:flex;flex-direction:column;gap:12px;min-height:0}
.dock h3{margin:0;font-size:14px;font-weight:600}
.dock .sub{font-size:12.5px;color:var(--muted-fg);margin:0}
.dock .chart{flex:1;min-height:0;display:flex}
.dock .chart svg{width:100%;height:100%;font-family:inherit}
.dock .foot{border-top:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted-fg)}
.dock .foot .spacer{flex:1}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.tbl th{font-weight:500;color:var(--muted-fg)}
.tbl td:last-child,.tbl th:last-child{text-align:right}

/* ---- Option A: Zinc Standard ---- */
.f-a .sb{width:248px;background:var(--sidebar);border-right:1px solid var(--border)}
.f-a .sb .head{padding:14px 12px 4px;display:flex;flex-direction:column;gap:12px}
.f-a .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:0 4px}
.f-a .brand .mark{width:22px;height:22px;border-radius:6px;background:var(--primary);color:var(--primary-fg);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.f-a .dock{width:392px;border-left:1px solid var(--border);background:var(--bg)}
.f-a .dock .head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.f-a .main.empty{justify-content:center}
.f-a .main.empty .composer{margin-bottom:12vh}

/* ---- Option B: Inset Cards ---- */
.f-b{background:var(--sidebar)}
.f-b .sb{width:244px;padding:10px 4px 0}
.f-b .sb .head{padding:4px 8px 8px;display:flex;flex-direction:column;gap:10px}
.f-b .brand{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13px;padding:0 4px}
.f-b .search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg);color:var(--muted-fg);font-size:13px}
.f-b .search .kbd{margin-left:auto}
.f-b .sb .grp{padding:12px 12px 2px;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}
.f-b .sb .row{height:28px;font-size:13px}
.f-b .sb .foot{border-top:0;padding:10px 12px 14px}
.f-b .inset{flex:1;display:flex;gap:8px;padding:8px 8px 8px 4px;min-width:0}
.f-b .card{background:var(--bg);border:1px solid var(--border);border-radius:calc(var(--r) + 4px);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.f-b .main{border-radius:calc(var(--r) + 4px)}
.f-b .hdr{height:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px 0 16px;gap:10px;flex:none}
.f-b .hdr .title{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-b .hdr .crumb{color:var(--muted-fg);font-size:13px}
.f-b .hdr .spacer{flex:1}
.f-b .theme-seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r);padding:2px;gap:1px}
.f-b .theme-seg span{display:inline-flex;align-items:center;justify-content:center;width:28px;height:24px;border-radius:calc(var(--r) - 2px);color:var(--muted-fg)}
.f-b .theme-seg span.active{background:var(--secondary);color:var(--fg)}
.f-b .col{max-width:680px;gap:20px}
.f-b .a .avatar{width:24px;height:24px;font-size:11px;margin-top:3px}
.f-b .compose-area{border-top:1px solid var(--border);padding:12px 16px 12px;flex:none}
.f-b .composer{max-width:680px;display:flex;flex-direction:column;gap:10px}
.f-b .chips{display:flex;gap:6px;align-items:center}
.f-b .field{display:flex;align-items:center;gap:8px;height:44px;border:1px solid var(--input);border-radius:var(--r);padding:0 6px 0 14px;background:var(--bg)}
.f-b .field .ph{flex:1;color:var(--muted-fg);font-size:14px}
.f-b .field .ph.filled{color:var(--fg)}
.f-b .dock{width:384px}
.f-b .dock .hdr{padding:0 12px 0 16px}
.f-b .dock .hdr .title{font-weight:600}
.f-b .empty-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:0 24px}
.f-b .empty-hero h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.f-b .empty-hero p{margin:0;color:var(--muted-fg);font-size:14px}

/* ---- Option C: Rail + Sheet ---- */
.f-c .rail{width:56px;flex:none;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.f-c .rail .ib{width:36px;height:36px;border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;color:var(--muted-fg)}
.f-c .rail .ib.active{background:var(--accent);color:var(--fg)}
.f-c .rail .ib.brand{background:var(--primary);color:var(--primary-fg);font-weight:700;font-size:12px;margin-bottom:8px}
.f-c .rail .bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px}
.f-c .sb{width:240px;border-right:1px solid var(--border);background:var(--bg)}
.f-c .sb .head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 16px;font-size:13px;font-weight:600}
.f-c .sb .grp{padding:12px 16px 4px}
.f-c .sb .row{height:34px;margin:0 8px;padding:0 8px}
.f-c .hdr{height:52px;display:flex;align-items:center;padding:0 12px 0 16px;gap:8px;flex:none}
.f-c .hdr .spacer{flex:1}
.f-c .picker{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--r);font-weight:600;font-size:14px}
.f-c .picker svg.ic{color:var(--muted-fg)}
.f-c .col{max-width:680px;gap:26px}
.f-c .a{font-size:15.5px}
.f-c .compose-area{padding:8px 24px 14px}
.f-c .composer{display:flex;flex-direction:column;gap:10px}
.f-c .chips{display:flex;gap:2px;align-items:center;padding:0 6px}
.f-c .pill{display:flex;align-items:center;gap:8px;min-height:52px;border:1px solid var(--input);border-radius:28px;padding:0 8px 0 8px;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.f-c .pill .ph{flex:1;color:var(--muted-fg);font-size:15px;padding-left:4px}
.f-c .pill .ph.filled{color:var(--fg)}
.f-c .dock-area{width:424px;flex:none;padding:12px 12px 12px 0;display:flex}
.f-c .dock{flex:1;border:1px solid var(--border);border-radius:calc(var(--r) + 4px);background:var(--card);box-shadow:var(--shadow)}
.f-c .dock .hdr{border-bottom:1px solid var(--border);height:48px;padding:0 8px 0 16px}
.f-c .dock .hdr .title{font-weight:600;font-size:14px}
.f-c .dock .tabsrow{padding:10px 12px 0}
.f-c .greet{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 24px 8vh}
.f-c .greet h2{margin:0;font-size:26px;font-weight:600;letter-spacing:-.025em}
.f-c .greet .composer{width:100%;max-width:680px}

@media (prefers-reduced-motion: no-preference){ .seg button{transition:background .12s,color .12s} }
</style>

<header class="topbar">
  <h1>Check de Cijfers restyle<small>Three plain shadcn/ui directions to react to — mockups only, nothing is built</small></h1>

</header>

];

/* ---------------- lucide-style icons ---------------- */

/* ---------------- "default Recharts" chart, drawn as plain SVG ---------------- */
/* Faithful to Recharts defaults: CartesianGrid #ccc dashed 3 3, axis line + ticks #666, 12px tick text,
   Legend below with text in the series color, dots r=3 white-filled. Series color #2563eb (first series). */
function chartSvg(c, w, h){
  const color = '#2563eb';
  const m = {t:10, r:30, b:30, l:60}, legendH = 30;
  const pw = w - m.l - m.r, ph = h - m.t - m.b - legendH;
  const yMax = c.ticks[c.ticks.length-1], y0 = m.t + ph;
  const ys = v => y0 - (v / yMax) * ph;
  const n = c.data.length, band = pw / n;
  const xs = i => m.l + band * i + band / 2;
  let s = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${c.title}">`;
  // grid
  c.ticks.forEach(t => { s += `<line x1="${m.l}" x2="${m.l+pw}" y1="${ys(t)}" y2="${ys(t)}" stroke="#ccc" stroke-dasharray="3 3"/>`; });
  for (let i=0;i<n;i++) s += `<line x1="${xs(i)}" x2="${xs(i)}" y1="${m.t}" y2="${y0}" stroke="#ccc" stroke-dasharray="3 3"/>`;
  // axes
  s += `<line x1="${m.l}" x2="${m.l+pw}" y1="${y0}" y2="${y0}" stroke="#666"/>`;
  s += `<line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${y0}" stroke="#666"/>`;
  for (let i=0;i<n;i++){
    s += `<line x1="${xs(i)}" x2="${xs(i)}" y1="${y0}" y2="${y0+6}" stroke="#666"/>`;
    s += `<text x="${xs(i)}" y="${y0+20}" text-anchor="middle" font-size="12" fill="#666">${c.data[i][0]}</text>`;
  }
  c.ticks.forEach(t => {
    s += `<line x1="${m.l-6}" x2="${m.l}" y1="${ys(t)}" y2="${ys(t)}" stroke="#666"/>`;
    s += `<text x="${m.l-10}" y="${ys(t)+4}" text-anchor="end" font-size="12" fill="#666">${String(t).replace('.',',')}</text>`;
  });
  // series
  if (c.kind === 'line'){
    const pts = c.data.map((d,i)=>`${xs(i)},${ys(d[1])}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>`;
    c.data.forEach((d,i)=>{ s += `<circle cx="${xs(i)}" cy="${ys(d[1])}" r="3" fill="#fff" stroke="${color}" stroke-width="2"/>`; });
  } else {
    const bw = band * 0.6;
    c.data.forEach((d,i)=>{ const y = ys(d[1]); s += `<rect x="${xs(i)-bw/2}" y="${y}" width="${bw}" height="${y0-y}" fill="${color}"/>`; });
  }
  // legend (Recharts default: icon + label in series color, centered below)
  const lx = m.l + pw/2, ly = h - 8;
  if (c.kind === 'line') s += `<line x1="${lx-52}" x2="${lx-22}" y1="${ly-4}" y2="${ly-4}" stroke="${color}" stroke-width="2"/><circle cx="${lx-37}" cy="${ly-4}" r="3" fill="#fff" stroke="${color}" stroke-width="2"/>`;
  else s += `<rect x="${lx-50}" y="${ly-11}" width="14" height="14" fill="${color}"/>`;
  s += `<text x="${lx-16}" y="${ly}" font-size="13" fill="${color}">${c.key}</text>`;
  return s + '</svg>';
}
function tableHtml(c){
  return `<table class="tbl"><thead><tr><th>Jaar</th><th>${c.unit}</th></tr></thead><tbody>${c.data.map(d=>`<tr><td>${d[0]}</td><td>${String(d[1].toFixed(1)).replace('.',',')}</td></tr>`).join('')}</tbody></table>`;
}

/* ---------------- shared fragments ---------------- */
function groups(activeClass){
  return Object.entries(threads).map(([g, rows]) => `<div class="grp">${g}</div>` + rows.map(r =>
    `<div class="row ${r.active ? 'active '+(activeClass||'') : ''}"><span>${r.t}</span></div>`).join('')).join('');
}
function assistant(m, opts={}){
  return `<div class="a">${opts.avatar ? '<div class="avatar sq">C</div>' : ''}<div><p>${m.text}</p>
    <div class="src"><span>Source</span><b>CBS StatLine</b><span class="dot"></span><span>${m.src.table}</span><span class="dot"></span><span>retrieved ${m.src.date}</span></div>
    ${opts.pin !== false ? `<div class="pin">${ic(opts.pinIcon||'line')}${m.pin}</div>` : ''}
  </div></div>`;
}
function messages(userClass, opts){
  return conv.map(m => m.role==='u' ? `<div class="u ${userClass}">${m.text}</div>` : assistant(m, opts)).join('');
}
const chipSet = (variant) => {
  const sq = variant==='sq' ? ' sq' : variant==='ghost' ? ' ghost' : '';
  return `<span class="chip on${sq}">${ic('db')}CBS data</span>
    <span class="chip off${sq}">${ic('globe')}Internet</span>
    <span class="chip${sq}">${ic('link')}Add link</span>
    <span class="chip dis${sq}">${ic('clip')}Upload file <span class="badge">soon</span></span>`;
};

/* ---------------- Option A: Zinc Standard ---------------- */
function optionA(state, theme){
  const chat = state==='chat';
  const sidebar = `<aside class="sb">
    <div class="head">
      <div class="brand"><span class="mark">C</span>Check de Cijfers</div>
      <button class="btn outline sm" style="justify-content:flex-start">${ic('pen')}New chat</button>
    </div>
    ${groups()}
    <div class="foot"><span class="avatar">S</span><span style="font-size:13px;font-weight:500;flex:1">Stefan</span>
      <span class="btn ghost icon sm" title="Toggle theme">${ic(theme==='dark'?'moon':'sun')}</span></div>
  </aside>`;
  const composer = (filled) => `<div class="composer"><div class="box">
      <div class="ta${filled?' filled':''}">${filled ? 'Vergelijk dit met Duitsland' : 'Ask about CBS statistics…'}</div>
      <div class="bar sm">${chipSet()}<span class="spacer"></span><span class="btn ${filled?'primary':'secondary'} icon sm">${ic('up')}</span></div>
    </div>${chat ? '' : '<p class="fine">Every number traces back to an official CBS cell, with source and date shown.</p>'}</div>`;
  const main = chat
    ? `<section class="main"><div class="msgs"><div class="col">${messages('bubble')}</div></div><div style="padding:8px 24px 16px">${composer(true)}</div></section>`
    : `<section class="main empty"><div style="padding:0 24px">${composer(false)}</div></section>`;
  const c = charts[1];
  const dock = chat ? `<aside class="dock">
      <div class="head"><div class="tabs-pill">${charts.map((ch,i)=>`<span class="tab${i===1?' active':''}">${ic(ch.kind)}${ch.tab}</span>`).join('')}</div>
        <span class="btn ghost icon sm">${ic('x')}</span></div>
      <div class="body"><div><h3>${c.title}</h3><p class="sub">${c.unit}</p></div><div class="chart">${chartSvg(c, 388, 300)}</div></div>
      <div class="foot"><span>${c.src}</span><span class="spacer"></span><span class="btn ghost xs">${ic('table')}Table</span><span class="btn ghost xs">${ic('dl')}PNG</span></div>
    </aside>` : '';
  return `<div class="frame f-a t-${theme}">${sidebar}${main}${dock}</div>`;
}

/* ---------------- Option B: Inset Cards ---------------- */
function optionB(state, theme){
  const chat = state==='chat';
  const sidebar = `<aside class="sb">
    <div class="head">
      <div class="brand"><span>Check de Cijfers</span><span class="btn primary icon xs">${ic('plus')}</span></div>
      <div class="search">${ic('search')}Search chats<span class="kbd">⌘K</span></div>
    </div>
    ${groups()}
    <div class="foot"><span class="avatar sq">S</span><span style="font-size:13px;font-weight:500;flex:1">Stefan</span><span class="btn ghost icon xs">${ic('sliders')}</span></div>
  </aside>`;
  const themeSeg = `<div class="theme-seg"><span class="${theme==='light'?'active':''}">${ic('sun')}</span><span class="${theme==='dark'?'active':''}">${ic('moon')}</span><span>${ic('monitor')}</span></div>`;
  const hdr = `<div class="hdr">${chat ? `<span class="crumb">Today</span><span class="crumb">/</span><span class="title">Inflatie en werkloosheid</span>` : `<span class="title">New chat</span>`}<span class="spacer"></span>${themeSeg}<span class="btn ghost sm">${ic('share')}Share</span></div>`;
  const compose = (filled) => `<div class="compose-area"><div class="composer">
      <div class="chips sm">${chipSet('sq')}</div>
      <div class="field"><span class="ph${filled?' filled':''}">${filled ? 'Vergelijk dit met Duitsland' : 'Ask a question about CBS statistics'}</span><span class="btn primary sm">Send ${ic('up')}</span></div>
    </div></div>`;
  const main = `<section class="card main">${hdr}${chat
    ? `<div class="msgs"><div class="col">${messages('card', {avatar:true, pinIcon:'bar'})}</div></div>`
    : `<div class="empty-hero"><h2>What do you want to know about the Netherlands?</h2><p>Official CBS statistics, computed and checked before they are shown.</p></div>`}${compose(chat)}</section>`;
  const c = charts[1];
  const dock = chat ? `<aside class="card dock">
      <div class="hdr"><span class="title">Charts</span><span class="crumb">2</span><span class="spacer"></span><span class="btn ghost icon xs">${ic('x')}</span></div>
      <div class="tabs-line">${charts.map((ch,i)=>`<span class="tab${i===1?' active':''}">${ch.title}</span>`).join('')}</div>
      <div class="body"><div><h3>${c.title}</h3><p class="sub">${c.unit}</p></div><div class="chart">${chartSvg(c, 368, 280)}</div></div>
      <div class="foot"><div class="tabs-pill sm"><span class="tab active">${ic('bar')}Chart</span><span class="tab">${ic('table')}Table</span></div><span class="spacer"></span><span>${c.src}</span></div>
    </aside>` : '';
  return `<div class="frame f-b t-${theme}">${sidebar}<div class="inset">${main}${dock}</div></div>`;
}

/* ---------------- Option C: Rail + Sheet ---------------- */
function optionC(state, theme){
  const chat = state==='chat';
  const rail = `<nav class="rail">
    <span class="ib brand">C</span>
    <span class="ib">${ic('pen')}</span>
    <span class="ib active">${ic('clock')}</span>
    <span class="ib">${ic('sliders')}</span>
    <div class="bottom"><span class="ib">${ic(theme==='dark'?'moon':'sun')}</span><span class="avatar">S</span></div>
  </nav>`;
  const sidebar = `<aside class="sb"><div class="head"><span>Chats</span><span class="btn ghost icon xs">${ic('panel')}</span></div>${groups('strong')}</aside>`;
  const hdr = `<div class="hdr"><span class="picker">Check de Cijfers ${ic('chev')}</span><span class="spacer"></span>${chat ? `<span class="btn ghost sm">${ic('share')}Share</span>` : ''}</div>`;
  const compose = (filled) => `<div class="composer">
      <div class="chips sm">${chipSet('ghost')}</div>
      <div class="pill"><span class="btn ghost icon round sm">${ic('plus')}</span><span class="ph${filled?' filled':''}">${filled ? 'Vergelijk dit met Duitsland' : 'Ask anything about CBS statistics'}</span><span class="btn primary icon round sm">${ic('up')}</span></div>
    </div>`;
  const main = `<section class="main">${hdr}${chat
    ? `<div class="msgs"><div class="col">${messages('inv', {pinIcon:'bar'})}</div></div><div class="compose-area">${compose(true)}</div>`
    : `<div class="greet"><h2>Good afternoon, Stefan</h2>${compose(false)}</div>`}</section>`;
  const c = charts[1];
  const dock = chat ? `<div class="dock-area"><aside class="dock">
      <div class="hdr"><span class="title">Charts</span><span class="spacer"></span><span class="btn ghost icon sm">${ic('dl')}</span><span class="btn ghost icon sm">${ic('x')}</span></div>
      <div class="tabsrow"><div class="tabs-chip">${charts.map((ch,i)=>`<span class="tab${i===1?' active':''}">${ic(ch.kind)}${ch.tab}</span>`).join('')}</div></div>
      <div class="body"><div><h3>${c.title}</h3><p class="sub">${c.unit}</p></div><div class="chart">${chartSvg(c, 400, 300)}</div></div>
      <div class="foot"><span>${c.src}</span><span class="spacer"></span><span class="btn ghost xs">${ic('table')}Open table</span></div>
    </aside></div>` : '';
  return `<div class="frame f-c t-${theme}">${rail}${sidebar}${main}${dock}</div>`;
}

/* ---------------- option notes ---------------- */
const notes = {
  a: {name:'A · Zinc Standard', blurb:'Stock shadcn as it comes out of the box. Flat sidebar with a hairline border, no header bar at all, the composer is a single rounded box with the source chips living inside it (Claude-style). The chart panel is a bordered column with pill tabs. Recommended starting point: least custom code, closest to "a general LLM chat".',
      facts:[['Font','Geist (shadcn default)'],['User message','muted grey bubble, right'],['Sidebar','248px, flat, border-right'],['Dock','fixed column, pill tabs'],['Theme toggle','icon in sidebar footer'],['Empty state','only the composer, centered']]},
  b: {name:'B · Inset Cards', blurb:'The shadcn "sidebar inset" variant: the sidebar sits directly on a grey ground, and the chat and the chart panel are two separate white cards. Denser sidebar with search. A real header bar per card carries the thread title and a three-way light/dark/system control. Chips sit above the input as squared toggles.',
      facts:[['Font','Inter'],['User message','outlined card, right'],['Sidebar','244px, compact rows, search'],['Dock','separate card, underline tabs'],['Theme toggle','3-way segment in header'],['Empty state','one-line title + composer at bottom']]},
  c: {name:'C · Rail + Sheet', blurb:'Most "app-like": a narrow icon rail plus a chat list panel (Linear / Claude-desktop shape), a ChatGPT-style header with the product name as a dropdown, and high-contrast black (or white in dark) user bubbles. The composer is a pill; the chart panel floats as a sheet with a shadow, inset from the edges.',
      facts:[['Font','System stack (SF / Segoe)'],['User message','inverted primary bubble, right'],['Sidebar','56px rail + 240px panel'],['Dock','floating sheet, chip tabs'],['Theme toggle','icon on the rail'],['Empty state','greeting + composer centered']]}
};
const render = {a:optionA, b:optionB, c:optionC};

/* ---------------- controls + layout ---------------- */
let opt='a', state='chat', theme='both';
try { const s = JSON.parse(localStorage.getItem('cdc-restyle')||'{}'); opt=s.opt||opt; state=s.state||state; theme=s.theme||theme; } catch(e){}

function seg(id, get, set){
  const el = document.getElementById(id);
  el.querySelectorAll('button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.v===get()));
    b.onclick = () => { set(b.dataset.v); el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', String(x===b))); draw(); };
  });
}
seg('opt-seg', ()=>opt, v=>opt=v);
seg('state-seg', ()=>state, v=>state=v);
seg('theme-seg', ()=>theme, v=>theme=v);

function frameBlock(o, th){
  const n = notes[o];
  return `<div><p class="frame-cap"><span>${n.name}</span><span>${th==='dark'?'Dark':'Light'} · ${state==='chat'?'mid-conversation':'empty'}</span></p><div class="frame-wrap">${render[o](state, th)}</div></div>`;
}
function noteBlock(o){
  const n = notes[o];
  return `<div><h2>${n.name}</h2><p>${n.blurb}</p></div><dl>${n.facts.map(f=>`<dt>${f[0]}</dt><dd>${f[1]}</dd>`).join('')}</dl>`;
}
function draw(){
  try { localStorage.setItem('cdc-restyle', JSON.stringify({opt,state,theme})); } catch(e){}
  const stage = document.getElementById('stage'), note = document.getElementById('note');
  const opts = opt==='all' ? ['a','b','c'] : [opt];
  const themes = theme==='both' ? ['light','dark'] : [theme];
  note.innerHTML = opt==='all' ? '' : noteBlock(opt);
  note.style.display = opt==='all' ? 'none' : '';
  stage.className = 'stage ' + (theme==='both' ? 'both' : 'all');
  let html = '';
  opts.forEach(o => {
    if (opt==='all') html += `<div class="note" style="grid-column:1/-1;margin:14px 0 -6px">${noteBlock(o)}</div>`;
    themes.forEach(th => html += frameBlock(o, th));
  });
  stage.innerHTML = html;
  fit();
}
function fit(){
  document.querySelectorAll('.frame-wrap').forEach(w => {
    const s = w.clientWidth / 1280;
    w.style.height = Math.round(800*s) + 'px';
    w.querySelector('.frame').style.transform = `scale(${s})`;
  });
}
window.addEventListener('resize', fit);
draw();
</script>
