# Dependency alerts + update PRs (Phase 0 ops guardrail, docs/03-mvp-scope.md:
# "automated dependency alerts"). Dependabot opens PRs for outdated/vulnerable
# npm packages and GitHub Actions. These are the ONE sanctioned exception to the
# build-phase "commit straight to main, no PRs" rule (CLAUDE.md): dependency
# bumps must be reviewed before merging, never blind-merged. Grouped + weekly to
# keep the noise low for a solo owner.
#
# Note: this file enables *version-update* PRs. Dependabot *security* alerts
# (vulnerability notifications) are a separate repo toggle the owner enables once
# under Settings -> Code security -> "Dependabot alerts" (docs/RUNBOOK.md).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One grouped PR per week for all npm updates, instead of one per package.
      npm-all:
        patterns:
          - "*"
    ignore:
      # ANY zod version bump can change z.toJSONSchema()'s serialized output
      # bytes, which changes the SHA-256 hash the hermetic LLM replay-fixture
      # system keys on (docs/open-questions.md #200) — confirmed by bisection
      # on the 4.4.3->4.5.4 hop, itself only a MINOR release, so this ignores
      # every update-type, not just major. A zod bump needs a coordinated
      # fixture re-record alongside it, not an automated one. Remove this
      # ignore only after that re-record happens deliberately. web/'s own
      # npm-web-all group is unaffected (it doesn't run the benchmark/fixture
      # scripts at all) and keeps updating zod normally.
      - dependency-name: "zod"
    commit-message:
      prefix: "deps"

  # web/ (the chat UI, ADR 018) is its own independent npm project — its own
  # package-lock.json, not covered by the root entry above.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-web-all:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(web)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
