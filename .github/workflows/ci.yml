# CI gate — the owner's trust signal. "The tests pass" is a claim only CI can make
# (CLAUDE.md conventions). Runs the gate suites below + the benchmark run/score
# pair on every push:
#   1. ingestion fixture tests   2. invariant tests   3. benchmark suite
#   4. registry tests (ADR 010)  5. query + benchmark-intent tests (WP5)
#   6. answer/intent tests (WP6) — the parser's LLM calls replay from committed
#      fixtures (ADR 012): still no API key, no network. The live half
#      (recording + calibration, npm run intent:eval) spends tokens and is
#      deliberately NOT on this gate.
#   7. chart tests (WP8) — spec builder + dumb SVG renderer, no LLM anywhere.
#   8. audit-record tests (WP10, R8) — every response writes a row that
#      reconstructs it; fail-closed when the audit store is down (ADR 016).
#   9. benchmark run + scorer (WP10): run-benchmark drives all 20 docs/02
#      tasks (+ the B15/B16 reply rounds + the un-disambiguated B3/B5
#      variants) through the AUDITED pipeline hermetically and dumps the audit
#      records; score-benchmark scores those records against the frozen key
#      (docs/03 gate: >=12/14 answerable, 6/6 refusal, zero fabricated
#      numbers) and fails the push below the gate. In CI a missing dump is a
#      failure — the gate may not silently degrade to structure-only.
#   10. billing tests (WP13, ADR 006 seams 2-4 / ADR 020): the append-only
#       credit ledger (structural trigger + reason/delta-sign CHECK,
#       signup-grant idempotency), the pricing-config idempotent apply, the
#       billing gate (debit-before-answer, compensate on any non-answer
#       outcome or thrown error, duplicate-request dedup), and Stripe webhook
#       signature verification + idempotency — signed with Stripe's own
#       generateTestHeaderString against hand-authored fixtures, no network,
#       no live Stripe account.
#   11. catalog tests (WP16 sub-part 1, ADR 025): cbs_catalog ingest/prune,
#       Stage-1 FTS recall + alias hints, the rerank hard-allowlist validator,
#       findTable routing, and the end-to-end replay test — the rerank's LLM
#       call replays from committed fixtures, still no API key, no network.
#   12. migration number collision check (open-questions #263): fails the push
#       if two files in migrations/ share a leading number — the cheap,
#       deterministic net for the cross-branch collision session 107 hit
#       post-merge (scripts/check-migration-numbers.ts).
# State per work package: the ingestion suite has real teeth since WP2 (wire-level
# corruption fixtures against an embedded Postgres, ADR 009); the registry suite
# (WP4) checks default_coordinates/period_semantics/canonical_measures apply
# idempotently and cross-checks canonical picks against the frozen answer key;
# since WP5 the query suite scores benchmark tasks B1-B14 against the frozen
# answer key (WP3) through the deterministic query layer using hand-authored
# structured intents, plus the B20 freshness refusal — all hermetic; since WP7
# the answer suite ALSO drives B1-B14 end-to-end (docs/02 phrasing → parser →
# query → composed Dutch answer, both LLM calls replayed from committed
# fixtures — ADR 012/013) and the invariant suite has real answer-side tests
# for R1/R2/R3/R4/R5/R9/R10/R11; since WP8 R6 is real (chart suite: B4/B8 line
# charts against the frozen key, spec determinism, renderer provenance); since
# WP10 R8 is real and the invariant suite carries ZERO todos — all eleven
# invariants are tested.
# WP12 (ADR 018): the chat UI (`web/`) adds two hermetic steps to the `web`
# job below — its own typecheck and its own component test suite (jsdom, no
# network) — plus, since session 110, a third: a five-test Playwright smoke
# that drives the real app in a real browser through the local dev harness
# (still hermetic — PGlite, an auth stand-in and an LLM fixture replay, no
# secrets, no spend). It exists for the failure class jsdom cannot see at all:
# a server/client module-boundary break that only happens in a running Next
# server — see the step's own comment.
# WP12 also adds a third JOB, `deploy`, gated on `[backend, web]` via
# `needs:` so a red run on either structurally blocks the deploy. `deploy`
# runs only on a direct push to main (this repo has
# no PRs/branch protection — CLAUDE.md, deliberate — so a `needs:` dependency
# is the only real deploy-blocking mechanism available). It is intentionally
# NOT hermetic: it calls the real Vercel CLI/API. The Vercel project has no
# git integration connected, so this job is the only thing that ever deploys —
# nothing races it.
# `web/` is deliberately its OWN independent npm project — its own
# package-lock.json, its own `npm ci` step here — not an npm workspace member
# of the root. This was a mid-session revision (ADR 018 point 9): a shared
# workspace lockfile repeatedly fought Vercel/Turbopack's assumption that a
# deployed Next.js app's node_modules are self-contained, causing two failed
# real deploy attempts before this fix. `web/backend` (a symlink to `../src`)
# is how it still reaches backend source code with zero package-level coupling.
# The `backend` and `web` jobs are both hermetic: no secrets, no network
# beyond npm — which is why the ingestion tests run on PGlite (ADR 009), never
# against Supabase, and why `web` runs its own typecheck/tests but not
# `next build` (which fetches fonts over the network at build time; that only
# happens inside `deploy`'s `vercel build`, downstream of a green run).
# Sharding addendum (session 101, 2026-09-13, open-questions #245): the eleven
# domain steps above used to run as sequential named steps inside one `gate`
# job — a real diagnosis (docs/session-briefs/2026-09-13-build-performance-diagnosis.md)
# found this bounded the gate by the SUM of its slowest files rather than
# letting them share the runner's cores, and that `tests/attachments`/
# `tests/usage` had no CI step at all. `gate` is now `backend` (a 3-way
# `vitest run --shard=N/3` matrix over every file under tests/ — including the
# two previously-uncovered directories, for free) plus a separate parallel
# `web` job; the benchmark run+score pair rides on shard 1 rather than its own
# step, since it doesn't depend on the other domain suites having run first in
# the same job. Every check above still runs on every push/PR, in the same
# process (`vitest run`), just distributed instead of sequential — nothing is
# skipped. Trade-off accepted per the diagnosis: the Actions UI no longer shows
# one named step per domain (mitigated with `--reporter=github-actions` for
# inline failure annotations); if a shard's timing skews badly (today's
# hash-based split, not yet duration-balanced — Tier 3-B in the diagnosis),
# revisit before adding a 4th shard.
name: CI

# Minute-saving triggers (owner request, 2026-09-09, session 91 — GitHub bills
# Actions minutes; a full run costs 7–12 min): (1) `push` runs only on `main`
# — a feature branch gets its gate through its pull request, so a branch with
# an open PR no longer runs twice per push; (2) documentation-only pushes
# (docs/, markdown) skip the run — nothing they touch is tested or deployed,
# and the docs-convention test runs again on the next code push; (3) a newer
# push to the same ref cancels the superseded run (`concurrency`), so the LAST
# push on `main` is always the one that deploys — this replaces the RUNBOOK's
# "two runs in flight, the last deploy to finish owns production" race.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # Manual escape hatch (added 2026-09-12, session 99): re-run the gate + deploy
  # for the current tip of main without pushing anything — e.g. when a deploy was
  # skipped and the tip is docs-only on top of the last code commit.
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Two independent lockfiles since web/ left the npm workspace
          # (ADR 018) — the cache key must cover both or web/ bumps silently
          # never refresh the cache (WP12 review).
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - name: Typecheck
        if: matrix.shard == 1
        run: npm run typecheck
      # Cross-branch migration-number collision guard (#263): two branches
      # once each minted migrations/031_*.sql under different filenames — git
      # never flags that (different filenames never conflict) — and the
      # clash surfaced only post-merge, as a Postgres
      # schema_migrations_pkey duplicate-key failure across every
      # applyMigrations-dependent suite. This is the cheap, deterministic
      # check that would have caught it on THIS push, before the full suite
      # runs. No DB, no network — filesystem + string parsing only.
      - name: Migration number collision check
        if: matrix.shard == 1
        run: npm run migrations:check-numbers
      # Covers every file under tests/ (ingestion, invariants, benchmark
      # structure, registry, query, answer, chart, audit, billing, catalog,
      # db, sources, websearch, threads, docs, attachments, usage — see the
      # sharding addendum above) split 3-way by vitest's own hash-based
      # sharding. github-actions reporter gives inline failure annotations
      # since the per-domain step names are gone (trade-off accepted above).
      - name: Backend tests (shard ${{ matrix.shard }}/3)
        run: npx vitest run --shard=${{ matrix.shard }}/3 --reporter=default --reporter=github-actions
      - name: Benchmark run (hermetic, audited pipeline)
        if: matrix.shard == 1
        run: npm run benchmark:run
      - name: Benchmark scorer (audit records vs frozen key)
        if: matrix.shard == 1
        run: npm run benchmark:score

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # Root install too, not just web's own — web/backend (a symlink to
      # ../src) means some of what web's tests import has its REAL path
      # under the repo root (zod/pg/@anthropic-ai/sdk are declared in BOTH
      # package.jsons for exactly this reason, ADR 018 point 9). The old
      # single `gate` job got this for free (one root `npm ci` at the top,
      # shared by every later step in the same job); splitting `web` into
      # its own job dropped it — caught by a real CI failure (session 101):
      # "Failed to resolve import zod from src/chart/brandfetch.ts". The
      # `deploy` job below already does this same root install for the
      # identical reason.
      - run: npm ci
      - name: Web app install (own, independent lockfile)
        run: npm run web:ci
      - name: Web app typecheck
        run: npm run web:typecheck
      - name: Web app tests (chart wrapper, jsdom, no network)
        run: npm run web:test
      # End-to-end smoke (session 110, web/playwright.config.ts): five short
      # Playwright tests that drive the REAL app in a REAL browser through the
      # local dev harness (scripts/dev-harness/start-all.mjs) — the hermetic CBS
      # fixture snapshot in PGlite, an auth stand-in on :9911 and an LLM
      # stand-in on :9912 replaying tests/fixtures/llm/**. No secrets, no
      # network beyond npm + the browser download, no LLM spend: this job stays
      # hermetic. It lives INSIDE the existing `web` job on purpose — a new job
      # would pay a second checkout + two `npm ci` installs for five tests, and
      # the owner is paying for these minutes.
      #
      # Why a browser at all, with >1000 hermetic tests already on this gate:
      # session 110's third UX audit found "Bewijs deze cijfers" — the
      # product's namesake action — present on a live answer and MISSING from
      # every stored one, because a server-side import of a 'use client' module
      # threw and was swallowed. vitest loads both modules as plain modules, so
      # the RSC/server-action boundary that actually breaks does not exist
      # there; no unit test could have seen it. Measured, not assumed: putting
      # that exact import back makes e2e/answer.spec.ts's replay test fail
      # while its live-answer test still passes.
      - name: Resolve the Playwright version (browser cache key)
        id: playwright
        run: echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium
        working-directory: web
      # A HARD gate since its first green run (run 35223290808, 2026-09-17,
      # session 110: Chromium installed, the harness started on the Linux
      # runner, 5/5 passed). It was added with `continue-on-error: true` for
      # exactly one run so an environment-only failure could not block the
      # deploy of code that passed every other gate; that reservation is spent.
      - name: Web app end-to-end smoke (dev harness, real browser)
        id: e2e
        run: npx playwright test
        working-directory: web
      - name: Playwright report (failures only)
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  deploy:
    needs: [backend, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # `vercel build` installs web/'s own dependencies itself, from web/'s
      # own package-lock.json — but web/backend (the symlink to ../src) means
      # some of what gets compiled has its REAL path under the repo root, not
      # under web/. Node/Turbopack resolve a symlinked file's own imports
      # relative to that real path, so zod/pg/@anthropic-ai/sdk (declared in
      # BOTH package.jsons, deliberately) also need root's own node_modules
      # to exist — hence this root install, restored after a failed deploy
      # attempt assumed it was redundant (ADR 018 point 9, attempt 5).
      - run: npm ci
      #
      # Two runs on main can be in flight at once (a docs-only push right
      # after a merge, 2026-09-03): each deploy job aliases ITS OWN commit to
      # production, so the deploy that FINISHES LAST wins — measured: the
      # docs commit 2d27175 re-aliased production over the merge 83f790e
      # that had gone live a minute earlier, and had to be promoted back by
      # hand (RUNBOOK "Two CI runs in flight"). Only the run whose commit is
      # still the tip of main deploys; a stale run skips every deploy step
      # below and stays green (its gate verdict is the point of that run).
      - name: Skip the deploy when main has moved on
        id: tip
        run: |
          tip=$(git ls-remote --heads origin main | cut -f1)
          echo "this run: ${GITHUB_SHA}  main tip: ${tip}"
          if [ -z "$tip" ]; then echo "could not read the tip of main"; exit 1; fi
          if [ "$tip" != "$GITHUB_SHA" ]; then
            # Docs-only pushes skip this workflow entirely (paths-ignore above),
            # so a docs commit landing on top of this one has NO run of its own —
            # if this run also stood down, nothing would deploy the code (it
            # happened 2026-09-12, session 99: six merged PRs, then a docs push,
            # production stayed on the old build). Only stand down when the
            # newer tip actually changes something outside docs/markdown.
            # Fail LOUDLY if the tip cannot be fetched or compared — a silent
            # stand-down here is the very failure this block exists to prevent.
            git fetch --quiet --depth=1 origin "$tip" || { echo "::error::could not fetch main tip ${tip}"; exit 1; }
            git cat-file -e "${tip}^{commit}" || { echo "::error::main tip ${tip} is not a commit after fetch"; exit 1; }
            set +e
            git diff --quiet "$GITHUB_SHA" "$tip" -- . ':(exclude)docs/**' ':(exclude,glob)**/*.md'
            rc=$?
            set -e
            case "$rc" in
              0) echo "::notice::main is at ${tip}, which differs from this run only in docs/markdown; this run still owns the deploy." ;;
              1) echo "stale=true" >> "$GITHUB_OUTPUT"
                 echo "::notice::main is already at ${tip} with code changes; that commit's own run deploys it. Skipping this deploy." ;;
              *) echo "::error::git diff against main tip ${tip} failed (exit ${rc})"; exit 1 ;;
            esac
          fi
      #
      # Commands run from the repo ROOT (no --cwd web) and rely entirely on
      # the Vercel PROJECT's own settings — rootDirectory: "web" plus
      # sourceFilesOutsideRootDirectory: true (Vercel's documented monorepo
      # mechanism, set via the API; no CLI equivalent exists) — to find the
      # app and still let it reach the web/backend symlink one level up.
      # `--cwd web` combined with a project-level rootDirectory double-applies
      # the subdirectory (a real, reproduced bug: ADR 018 point 9) — the two
      # are alternatives, never both.
      - name: Install Vercel CLI
        if: steps.tip.outputs.stale != 'true'
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings and env vars
        if: steps.tip.outputs.stale != 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        if: steps.tip.outputs.stale != 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy prebuilt output
        if: steps.tip.outputs.stale != 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # A green deploy proves the BUILD succeeded, not that the app runs:
      # on 2026-07-04 a deploy whose middleware was compiled with empty
      # NEXT_PUBLIC_* values went green while every route returned 500
      # (lessons-learned). This step makes that failure class loud: the
      # deployed app must actually serve a page. -L follows the auth
      # redirect to /login; anything but a final 200 fails the job.
      - name: Post-deploy smoke check (the app must serve, not just build)
        if: steps.tip.outputs.stale != 'true'
        run: |
          sleep 10
          for path in / /login /llms.txt; do
            status=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 30 "https://checkdecijfers.vercel.app${path}")
            echo "GET ${path} -> ${status} (after redirects)"
            test "$status" = "200"
          done
          # #114: the auth-free health route — runs the SAME real DB reads the
          # signed-in dashboard makes (balance/history/pricing, incl. the
          # onboarding join), the class the anonymous paths above are blind to
          # (session-27 incident: GET / 500'd for every logged-in user while
          # this smoke stayed green). Deliberately NO -L here: a proxy
          # regression that un-exempts the route would 307 to /login, and
          # following it would report /login's 200 as health (the WP16 go-live
          # bug class) — the raw status must be exactly 200. The body is check
          # names only (no data, no error text), so echoing it is safe and
          # names the failing check right in this log.
          health=$(curl -s --max-time 30 -w '\n%{http_code}' "https://checkdecijfers.vercel.app/api/health")
          status=$(printf '%s' "$health" | tail -n 1)
          echo "GET /api/health -> ${status} (no redirects followed): $(printf '%s' "$health" | head -n 1)"
          test "$status" = "200"
